let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredPrompt = e; document.getElementById('btnInstalar').classList.add('mostrar'); });
function instalarApp(){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; document.getElementById('btnInstalar').classList.remove('mostrar'); }); } else { alert('No seu celular: toque nos 3 pontinhos ⋮ > Adicionar à tela inicial / Instalar app'); } }

  document.getElementById('btnSanfona').classList.toggle('fechado', !cardAberto);

function deveSerNoite(){ let h = new Date().getHours(); if(h >= 18 || h < 6) return true; if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return true; return false; }
function aplicarNoite(){ let noite = deveSerNoite(); document.body.classList.toggle('dark', noite); let txt = document.getElementById('modoTxt'); if(txt) txt.innerText = noite ? '🌙 Modo noturno • Auto' : '☀️ Modo claro • Auto'; if(window.trocarMapa) trocarMapa(window.modoAtual || 'satelite'); }
setInterval(aplicarNoite, 60000);
if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarNoite);
function atualizarBateria(bat, carregando){ bat = parseInt(bat||0); let carregandoReal = carregando===true || carregando==='true' || carregando===1 || carregando==='1'; let fill = document.getElementById('bateriaFill'); let txt = document.getElementById('bateriaTxt'); let status = document.getElementById('statusCarregando'); fill.style.width = bat + '%'; fill.className = 'bateria-fill ' + (bat>50 ? 'verde' : bat>20 ? 'amarelo' : 'vermelho'); fill.innerText = carregandoReal ? '⚡' : ''; txt.innerHTML = bat + '%<small id="bateriaSub">' + (carregandoReal ? 'Carregando' : 'Bateria') + '</small>'; txt.classList.toggle('carregando', carregandoReal); status.innerText = carregandoReal ? '⚡ Carregando' : (bat<=20 ? '🪫 Bateria fraca' : ''); status.style.display = (carregandoReal || bat<=20) ? 'block' : 'none'; let bv = document.getElementById('batteryValue'); bv.innerText = bat + '%' + (carregandoReal ? ' ⚡' : ''); document.getElementById('batteryLabel').innerText = carregandoReal ? '⚡ Carregando' : 'Bateria do celular'; }
let map=L.map('map',{zoomControl:false, maxZoom:20, minZoom:3, zoomSnap:1, zoomDelta:1, scrollWheelZoom:true, doubleClickZoom:true, touchZoom:true, dragging:true}).setView([-20.388,-43.757],17);
let camadaRua=L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20, maxNativeZoom:20});
let camadaSatelite=L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:20, maxNativeZoom:20}).addTo(map);
let carroIcon=L.divIcon({html:'<div style="background:#00c9a7;width:22px;height:22px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>',iconSize:[28,28],className:''});

let pathCoords=[]; let ultimoLat=0, ultimoLng=0, ultimoTempo=0, seguir=true, modoAtual='satelite', movendoProg=false, zoomManual=17, atualizandoAgora=false;
let ultimaRuaLat=0, ultimaRuaLng=0, buscandoRua=false, ultimaRuaTxt='', latAtualGlobal=0, lngAtualGlobal=0;

function zoomMenos(){ zoomManual = Math.max(3, map.getZoom()-1); map.setZoom(zoomManual); document.getElementById('zoomTxt').innerText = zoomManual; }
function atualizarBtnSeguir(){ let b = document.getElementById('btnSeguir'); b.innerText = seguir ? '📍 Seguir: ON' : '📍 Seguir: OFF'; b.className = 'btn-seguir ' + (seguir ? 'on' : 'off'); }
function toggleSeguir(){ seguir = !seguir; atualizarBtnSeguir(); if(seguir && ultimoLat){ movendoProg = true; map.setView([ultimoLat, ultimoLng], zoomManual); setTimeout(()=>{ movendoProg = false; }, 300); } }
map.on('dragstart', ()=>{ if(seguir && !movendoProg){ seguir = false; atualizarBtnSeguir(); } });
map.on('zoomend',()=>{ zoomManual = map.getZoom(); document.getElementById('zoomTxt').innerText = zoomManual; });
function trocarMapa(m){ modoAtual=m; map.removeLayer(camadaRua); map.removeLayer(camadaSatelite); document.body.classList.remove('modo-rua','modo-satelite'); if(m==='rua'){ camadaRua.addTo(map); document.body.classList.add('modo-rua'); document.getElementById('txtModo').innerText='Rua'; } if(m==='satelite'){ camadaSatelite.addTo(map); document.body.classList.add('modo-satelite'); document.getElementById('txtModo').innerText='Satélite'; } }
function trocarMapaAlternar(){ if(modoAtual==='satelite') trocarMapa('rua'); else trocarMapa('satelite'); }
function abrirPainel(){ document.getElementById('painelBaixo').classList.add('aberto'); }
function fecharPainel(){ document.getElementById('painelBaixo').classList.remove('aberto'); }
function distanciaM(lat1,lon1,lat2,lon2){ let dLat=(lat2-lat1)*Math.PI/180; let dLng=(lon2-lon1)*Math.PI/180; let a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2; return 6371000*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function forcarRua(){ ultimaRuaLat=0; ultimaRuaLng=0; ultimaRuaTxt=''; document.getElementById('addrDisplay').innerText='Buscando rua de novo...'; if(latAtualGlobal) buscarEndereco(latAtualGlobal, lngAtualGlobal, true); }
async function buscarEndereco(lat,lon,forcar){
  if(buscandoRua) return;
  if(!forcar && ultimaRuaLat && distanciaM(lat,lon,ultimaRuaLat,ultimaRuaLng) < 100 && ultimaRuaTxt){ return; }
  buscandoRua = true;
  try{
    let r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=pt-BR`);
    let j = await r.json();
    let a = j.address || {};
    let rua = a.road || a.pedestrian || a.footway || a.path || a.cycleway || '';
    let bairro = a.suburb || a.neighbourhood || a.village || a.hamlet || '';
    let cidade = a.city || a.town || a.municipality || a.county || '';
    let estado = a.state || '';
    let txt = '';
    if(rua) txt = rua;
    else if(bairro) txt = 'Estrada sem nome, perto de ' + bairro;
    else if(cidade) txt = 'Estrada sem nome, perto de ' + cidade;
    else txt = 'Local sem nome de rua';
    if(bairro && rua && bairro !== rua) txt += ', ' + bairro;
    if(cidade && cidade !== bairro) txt += ' - ' + cidade;
    if(estado) txt += '/' + (estado === 'Minas Gerais' ? 'MG' : estado);
    ultimaRuaLat = lat; ultimaRuaLng = lon; ultimaRuaTxt = txt;
    document.getElementById('addrDisplay').innerText = txt;
    document.getElementById('addrDisplay').classList.remove('vermelho');
  }catch(e){
    if(!ultimaRuaTxt){
      document.getElementById('addrDisplay').innerText = 'Toque aqui para buscar a rua de novo';
    }
  }finally{ buscandoRua = false; }
}
function calcVelocidade(lat,lon){ let agora=Date.now(); if(!ultimoLat){ ultimoLat=lat; ultimoLng=lon; ultimoTempo=agora; return 0; } let dt=(agora-ultimoTempo)/1000/3600; if(dt===0) return 0; let dLat=(lat-ultimoLat)*Math.PI/180; let dLng=(lon-ultimoLng)*Math.PI/180; let a=Math.sin(dLat/2)**2 + Math.cos(ultimoLat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLng/2)**2; let dist=6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); let vel=dist/dt; ultimoLat=lat; ultimoLng=lon; ultimoTempo=agora; if(vel>200) vel=0; return Math.round(vel); }
async function atualizar(){
  if(atualizandoAgora) return;
  atualizandoAgora = true;
  let btn = document.getElementById('btnRefresh');
  if(btn) btn.classList.add('girando');
  document.getElementById('lastUpdate').innerText = 'Atualizando...';
  try{
    let r=await fetch(`${SUPABASE_URL}/rest/v1/rastreador?device_id=eq.${DEVICE_ID}&order=updated_at.desc&limit=20`,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    let dados=await r.json();
    if(!dados||!dados.length){ document.getElementById('addrDisplay').innerText='No location to show'; document.getElementById('addrDisplay').classList.add('vermelho'); document.getElementById('lastUpdate').innerText='Sem localização'; return; }
    let atual=dados[0]; let lat=parseFloat(atual.lat), lon=parseFloat(atual.lng); let vel=calcVelocidade(lat,lon);
    latAtualGlobal=lat; lngAtualGlobal=lon;
    marker.setLatLng([lat,lon]);
    movendoProg=true; map.setView([lat,lon], zoomManual); map.invalidateSize(); setTimeout(()=>{movendoProg=false},200);
    pathCoords.push([lat,lon]); if(pathCoords.length>100) pathCoords.shift(); polyline.setLatLngs(pathCoords);
    document.getElementById('latDisplay').innerText=lat.toFixed(6); document.getElementById('lngDisplay').innerText=lon.toFixed(6);
    atualizarBateria(atual.battery, atual.charging);
    document.getElementById('signalValue').innerText=(atual.accuracy||0)+'m'; document.getElementById('signalValue2').innerText=(atual.accuracy||0)+'m';
    document.getElementById('speedText').innerText=vel+' km/h';
    document.getElementById('speedPillText').innerText=vel;
    document.getElementById('speedPill').classList.toggle('andando', vel>0);
    document.getElementById('lastUpdate').innerText='Atualizado '+new Date().toLocaleTimeString('pt-BR');
    buscarEndereco(lat,lon,false);
    let html=''; dados.slice(0,10).forEach(d=>{ let chg = d.charging ? ' ⚡ Carregando' : ''; html+=`<div class="hist-item">${parseFloat(d.lat).toFixed(5)}, ${parseFloat(d.lng).toFixed(5)} • 🔋 ${d.battery}%${chg}<br><small>${new Date(d.updated_at).toLocaleString('pt-BR')}</small></div>`; });
    document.getElementById('historyList').innerHTML=html;
  }catch(e){ document.getElementById('lastUpdate').innerText='Erro ao atualizar - tente de novo'; }
  finally{ if(btn) btn.classList.remove('girando'); atualizandoAgora=false; }
}
document.getElementById('btnRefresh').addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); atualizar(); });
function pegarLocal(){ let lat=document.getElementById('latDisplay').innerText; let lon=document.getElementById('lngDisplay').innerText; if(lat==='--') return null; return {lat, lon}; }
function abrirWaze(){ let l=pegarLocal(); if(!l) return alert('Sem localização ainda'); window.location.href = `waze://?ll=${l.lat},${l.lon}&navigate=yes`; setTimeout(()=>{ window.open(`https://waze.com/ul?ll=${l.lat},${l.lon}&navigate=yes`,'_blank'); }, 800); }
function abrirMaps(){ let l=pegarLocal(); if(!l) return alert('Sem localização ainda'); window.open(`https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lon}&travelmode=driving`,'_blank'); }
function copiarLocal(){ let l=pegarLocal(); if(!l) return alert('Sem localização ainda'); let txt = `https://www.google.com/maps?q=${l.lat},${l.lon}`; if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert('Localização copiada!')); else alert(txt); }
aplicarNoite();
atualizar(); setInterval(atualizar,3000);
window.addEventListener('resize', ()=>{ map.invalidateSize(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ map.invalidateSize(); }, 300); });
</script>
